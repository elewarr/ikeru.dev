{{ define "main" }}
{{ .Content }}
  {{ range .Pages }}
    <article>
    <!-- RelPermalink (not .Permalink): root-relative hrefs resolve against any origin,
         so the lychee gate can verify newly added pages locally before they deploy. -->
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      {{ with .Description }}<p>{{ . }}</p>
      {{ else }}<p>{{ .Summary | plainify }}</p>
      {{ end }}
    </article>
  {{ end }}
{{ end }}
